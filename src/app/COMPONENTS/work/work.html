<section id="work" class="py-20 md:py-28 bg-[#f4f2ee]">
  <div class="container w-[90%] md:w-[80%] mx-auto">

    <!-- Section Header -->
    <div class="mb-14">
      <p class="text-[12px] font-bold uppercase tracking-[0.35em] text-[#FF6B35] mb-3">Portfolio</p>
      <h2 class="text-3xl sm:text-4xl font-bold text-[#111]" style="font-family: 'Space Grotesk', sans-serif;">
        Featured <span class="text-[#FF6B35]">Projects</span>
      </h2>
    </div>

    <!-- Main content -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-center">

      <!-- Project Info -->
      <div class="project-info order-2 lg:order-1 relative z-50">
        <div class="space-y-5">
          <h3 class="text-xs font-bold text-[#FF6B35] mb-2 uppercase tracking-widest">Featured Project</h3>
          <h2 class="text-2xl md:text-3xl font-bold mb-4 project-title text-[#111]" style="font-family: 'Space Grotesk', sans-serif;">{{ currentProject.title }}</h2>
          <p class="text-sm md:text-base text-[#666] leading-relaxed mb-5 project-description">
            {{ currentProject.description }}
          </p>

          <div class="mb-5">
            <p class="text-xs font-bold mb-3 text-[#999] uppercase tracking-wider">Technologies Used:</p>
            <div class="flex flex-wrap gap-2 project-tech">
              <span *ngFor="let tech of currentProject.technologies"
                class="px-3 py-1 rounded-full bg-[#FF6B35]/10 text-[#FF6B35] text-xs font-bold border border-[#FF6B35]/20">
                {{ tech }}
              </span>
            </div>
          </div>

          <div class="flex gap-3 mt-5">
            <button type="button" (click)="openProjectLink()"
              class="project-live relative z-50 px-5 py-2.5 bg-[#FF6B35] text-white font-bold rounded-lg hover:bg-[#e05520] transition-all duration-300 cursor-pointer text-sm shadow-[0_4px_16px_rgba(255,107,53,0.3)]">
              View Project
            </button>
          </div>
        </div>
      </div>

      <!-- Project Images -->
      <div class="project-images order-1 lg:order-2 relative">
        <div class="relative">
          <div class="border border-black/8 p-3 md:p-4 rounded-2xl overflow-hidden bg-white shadow-sm">
            <img
              [src]="currentProject.mainImage"
              [alt]="currentProject.title"
              class="project-main-image w-full rounded-xl object-cover object-center h-48 md:h-72">
          </div>

          <!-- Arrow Buttons -->
          <div class="flex justify-center gap-4 mt-6">
            <button type="button" (click)="previousProject()"
              class="flex items-center justify-center w-11 h-11 rounded-full border border-black/12 text-[#888] bg-white shadow-sm hover:bg-[#FF6B35] hover:border-[#FF6B35] hover:text-white hover:shadow-[0_4px_16px_rgba(255,107,53,0.3)] hover:scale-110 transition-all duration-300 cursor-pointer"
              aria-label="Previous project">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
              </svg>
            </button>
            <button type="button" (click)="nextProject()"
              class="flex items-center justify-center w-11 h-11 rounded-full border border-black/12 text-[#888] bg-white shadow-sm hover:bg-[#FF6B35] hover:border-[#FF6B35] hover:text-white hover:shadow-[0_4px_16px_rgba(255,107,53,0.3)] hover:scale-110 transition-all duration-300 cursor-pointer"
              aria-label="Next project">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
